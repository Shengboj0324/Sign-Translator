<svg viewBox="0 0 1040 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker>
    <style>
      .t{fill:#0f172a;font-size:15px;font-weight:700;}
      .s{fill:#475569;font-size:12px;}
      .cap{fill:#64748b;font-size:11.5px;}
      .eq{fill:#1e293b;font-size:12.5px;}
      .ax{fill:#334155;font-size:11px;}
    </style>
  </defs>

  <text x="520" y="32" text-anchor="middle" style="fill:#0f172a;font-size:20px;font-weight:700;">Conditional Motion Diffusion</text>
  <text x="520" y="53" text-anchor="middle" class="cap">A temporal DiT denoises a noise sequence into signing motion, conditioned on the manifold plan; classifier-free guidance trades diversity for fidelity.</text>

  <!-- forward / reverse chain -->
  <g>
    <rect x="60" y="95" width="90" height="60" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="105" y="130" text-anchor="middle" class="t">x₀</text>
    <text x="105" y="172" text-anchor="middle" class="cap">clean motion</text>

    <rect x="300" y="95" width="90" height="60" rx="8" fill="#fef9c3" stroke="#eab308"/>
    <text x="345" y="130" text-anchor="middle" class="t">xₜ</text>

    <rect x="640" y="95" width="90" height="60" rx="8" fill="#fee2e2" stroke="#ef4444"/>
    <text x="685" y="130" text-anchor="middle" class="t">x_T</text>
    <text x="685" y="172" text-anchor="middle" class="cap">Gaussian noise</text>

    <!-- forward arrow -->
    <line x1="152" y1="112" x2="298" y2="112" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a3)"/>
    <text x="225" y="104" text-anchor="middle" class="cap">forward  q(xₜ|x₀)</text>
    <line x1="392" y1="112" x2="638" y2="112" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a3)"/>

    <!-- reverse arrow -->
    <line x1="638" y1="140" x2="392" y2="140" stroke="#334155" stroke-width="1.7" marker-end="url(#a3)"/>
    <text x="515" y="158" text-anchor="middle" class="cap" fill="#0f172a">reverse denoiser  p_θ(x_{t−1}|xₜ, c)</text>
    <line x1="298" y1="140" x2="152" y2="140" stroke="#334155" stroke-width="1.7" marker-end="url(#a3)"/>
  </g>

  <!-- schedule identity box -->
  <rect x="770" y="90" width="230" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="885" y="114" text-anchor="middle" class="t" style="font-size:13px;">variance-preserving schedule</text>
  <text x="885" y="142" text-anchor="middle" class="eq">xₜ = a·x₀ + b·ε</text>
  <text x="885" y="166" text-anchor="middle" class="eq">a = √ᾱₜ ,  b = √(1−ᾱₜ)</text>
  <text x="885" y="192" text-anchor="middle" class="eq" font-weight="700">a² + b² = 1</text>
  <text x="885" y="220" text-anchor="middle" class="cap">ε / x₀ / v targets interconvert;</text>
  <text x="885" y="234" text-anchor="middle" class="cap">v = a·ε − b·x₀</text>

  <!-- a,b curves -->
  <g transform="translate(60,270)">
    <text x="330" y="-6" text-anchor="middle" class="t" style="font-size:13px;">signal a(t) and noise b(t) across the schedule</text>
    <!-- axes -->
    <line x1="40" y1="120" x2="660" y2="120" stroke="#94a3b8" stroke-width="1"/>
    <line x1="40" y1="10" x2="40" y2="120" stroke="#94a3b8" stroke-width="1"/>
    <text x="30" y="16" text-anchor="end" class="ax">1</text>
    <text x="30" y="122" text-anchor="end" class="ax">0</text>
    <text x="40" y="140" text-anchor="middle" class="ax">t=0</text>
    <text x="660" y="140" text-anchor="middle" class="ax">t=T</text>
    <!-- a decreasing 1->0 (cosine-ish) -->
    <path d="M40,12 C 250,20 430,70 660,118" fill="none" stroke="#22c55e" stroke-width="2.2"/>
    <text x="150" y="34" class="s" fill="#16a34a">a(t) = √ᾱₜ  (signal)</text>
    <!-- b increasing 0->1 -->
    <path d="M40,118 C 250,70 430,20 660,12" fill="none" stroke="#ef4444" stroke-width="2.2"/>
    <text x="470" y="34" class="s" fill="#dc2626">b(t) = √(1−ᾱₜ)  (noise)</text>
    <!-- unit circle inset showing a2+b2=1 -->
    <g transform="translate(560,150)">
      <circle cx="40" cy="-30" r="34" fill="none" stroke="#6366f1" stroke-width="1.4"/>
      <line x1="40" y1="-30" x2="64" y2="-54" stroke="#6366f1" stroke-width="1.6"/>
      <text x="40" y="24" text-anchor="middle" class="cap" fill="#4338ca">(a,b) on unit circle</text>
    </g>
  </g>
</svg>
