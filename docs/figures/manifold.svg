<svg viewBox="0 0 1040 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker>
    <style>
      .t{fill:#0f172a;font-size:15px;font-weight:700;}
      .s{fill:#475569;font-size:12px;}
      .eq{fill:#1e293b;font-size:13px;}
      .cap{fill:#64748b;font-size:11.5px;}
    </style>
  </defs>

  <text x="520" y="34" text-anchor="middle" style="fill:#0f172a;font-size:20px;font-weight:700;">The Shared Motion–Language Manifold</text>
  <text x="520" y="55" text-anchor="middle" class="cap">Meaning and motion are projected to unit vectors on a common hypersphere; paired examples are pulled together, hard negatives pushed apart.</text>

  <!-- left: language encoder -->
  <rect x="40" y="110" width="150" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="115" y="138" text-anchor="middle" class="t">Language</text>
  <text x="115" y="156" text-anchor="middle" class="s">gloss / plan encoder</text>

  <rect x="40" y="290" width="150" height="60" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="115" y="318" text-anchor="middle" class="t">Motion</text>
  <text x="115" y="336" text-anchor="middle" class="s">ST-GCN / VQ encoder</text>

  <!-- projection heads -->
  <rect x="230" y="150" width="120" height="46" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="290" y="178" text-anchor="middle" class="s">proj → vᵢ ∈ 𝕊ᵈ⁻¹</text>
  <rect x="230" y="264" width="120" height="46" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="290" y="292" text-anchor="middle" class="s">proj → uᵢ ∈ 𝕊ᵈ⁻¹</text>

  <line x1="190" y1="140" x2="228" y2="168" stroke="#334155" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="190" y1="320" x2="228" y2="292" stroke="#334155" stroke-width="1.4" marker-end="url(#a2)"/>

  <!-- sphere -->
  <circle cx="620" cy="240" r="130" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <ellipse cx="620" cy="240" rx="130" ry="42" fill="none" stroke="#67e8f9" stroke-width="1"/>
  <ellipse cx="620" cy="240" rx="42" ry="130" fill="none" stroke="#67e8f9" stroke-width="1"/>
  <text x="620" y="120" text-anchor="middle" class="s" fill="#0e7490">unit hypersphere</text>

  <!-- aligned pair -->
  <circle cx="668" cy="188" r="7" fill="#3b82f6"/>
  <circle cx="676" cy="196" r="7" fill="#22c55e"/>
  <text x="700" y="188" class="cap">uᵢ ≈ vᵢ  (positive pair)</text>

  <!-- hard negative -->
  <circle cx="560" cy="300" r="7" fill="#22c55e"/>
  <circle cx="700" cy="300" r="7" fill="#3b82f6"/>
  <line x1="567" y1="300" x2="693" y2="300" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="630" y="330" text-anchor="middle" class="cap" fill="#b91c1c">hard negative: differs in one licensed feature (negation, number …)</text>

  <line x1="350" y1="173" x2="500" y2="215" stroke="#334155" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="350" y1="287" x2="500" y2="262" stroke="#334155" stroke-width="1.4" marker-end="url(#a2)"/>

  <!-- equations -->
  <text x="120" y="405" class="eq" font-weight="700">Contrastive objective</text>
  <text x="120" y="430" class="eq">L_NCE = −(1/2B) Σᵢ [ log ( e^(uᵢ·vᵢ/τ) / Σⱼ e^(uᵢ·vⱼ/τ) ) + log ( e^(vᵢ·uᵢ/τ) / Σⱼ e^(vᵢ·uⱼ/τ) ) ]</text>
  <text x="120" y="454" class="cap">Learnable temperature τ (CLIP-clamped). Retrieval recall@k — not the loss value — is the reported evidence.</text>
</svg>
