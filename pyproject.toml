[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signtranslator"
version = "0.1.0"
description = "Bidirectional neural sign-language translation with a shared motion-language manifold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sign-Translator project" }]
dependencies = [
    "av>=18,<19",
    "torch>=2.13,<2.14",
    "numpy>=2.5,<2.6",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<9.2"]
# Heavy foundation-model backends are optional and swapped in behind interfaces.
# They are NOT required to build, train (on synthetic data), or test the core.
foundation = [
    "transformers>=4.40,<5",
    "soundfile>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["signtranslator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
