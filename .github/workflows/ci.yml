name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked core environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Compile
        run: python -m compileall -q signtranslator tests
      - name: Warning-strict test suite
        run: python -W error -m pytest
      - name: Mechanical synthetic smoke run
        run: |
          python - <<'PY'
          import os
          from signtranslator.run import run_pipeline

          out = os.path.join(os.environ["RUNNER_TEMP"], "signtranslator-smoke")
          result = run_pipeline(
              out,
              epochs=1,
              batch_size=32,
              diff_timesteps=10,
              regenerate=True,
              do_analyze=False,
              gen_finetune_epochs=0,
              polish_epochs=0,
              verbose=False,
          )
          assert result["history"] is not None
          PY

  clean-archive:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create source archive without Git metadata
        run: |
          mkdir -p "$RUNNER_TEMP/signtranslator-archive"
          git archive --format=tar HEAD -o "$RUNNER_TEMP/signtranslator.tar"
          tar -xf "$RUNNER_TEMP/signtranslator.tar" -C "$RUNNER_TEMP/signtranslator-archive"
      - name: Build and install immutable wheel from archive
        working-directory: ${{ runner.temp }}/signtranslator-archive
        run: |
          python -m pip install -r requirements.lock
          python -m pip wheel --no-build-isolation --no-deps . --wheel-dir "$RUNNER_TEMP/wheels"
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/wheels/signtranslator-*.whl
      - name: Verify archive tests and content-only provenance
        working-directory: ${{ runner.temp }}/signtranslator-archive
        run: |
          python -m compileall -q signtranslator tests
          python -W error -m pytest
      - name: Verify installed-wheel content-only provenance
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from signtranslator.data_engineering.how2sign_audit import _implementation_identity
          from signtranslator.pretraining.how2sign_motion import _implementation_identity as motion_identity

          for identity in (_implementation_identity(), motion_identity()):
              assert identity["identity_kind"] == "content-only"
              assert identity["git_revision"] is None
              assert len(identity["implementation_sha256"]) == 64
          PY
      - name: Verify checkpoint reload from archive
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os
          import torch
          from signtranslator.run import run_pipeline
          from signtranslator.training import checkpoint_paths

          corpus = os.path.join(os.environ["RUNNER_TEMP"], "archive-smoke-corpus")
          prefix = os.path.join(os.environ["RUNNER_TEMP"], "archive-smoke.pt")
          trained = run_pipeline(
              corpus, epochs=1, batch_size=32, diff_timesteps=10,
              regenerate=True, do_analyze=False, ckpt_path=prefix,
              gen_finetune_epochs=0, polish_epochs=0, verbose=False)
          best = checkpoint_paths(prefix)["best"]
          reloaded = run_pipeline(
              corpus, epochs=1, batch_size=32, diff_timesteps=10,
              do_train=False, do_analyze=False, ckpt_path=str(best),
              gen_finetune_epochs=0, polish_epochs=0, verbose=False)
          gloss = torch.tensor([[3, 4, 5]], dtype=torch.long)
          torch.manual_seed(91)
          expected = trained["model"].generate_from_gloss(gloss, ddim_steps=3)
          torch.manual_seed(91)
          actual = reloaded["model"].generate_from_gloss(gloss, ddim_steps=3)
          assert torch.equal(expected, actual)
          PY
